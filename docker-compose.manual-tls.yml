# Override para servidores onde 80/443 já pertencem a outro serviço (aqui:
# AzuraCast) e o provedor de DNS (Wix) não tem API para o desafio DNS-01
# automático. O certificado é emitido manualmente com certbot fora do
# Docker (veja docs/certbot-manual-dns.md) e só é consumido aqui, como
# arquivo estático - este container não fala com a Let's Encrypt.
#
# Nada é publicado na porta 80/443 do host: só esta porta nova
# (SUPABASE_PROXY_PORT, padrão 9443) é exposta, então não há disputa de
# porta com nada que já exista no servidor.
#
# O Studio fica atrás de uma tela de abertura + login própria
# (login-server.js), validada pelo Nginx via "auth_request" - substitui o
# pop-up nativo de Basic Auth do navegador por uma página com botão
# "Entrar" (revela um formulário), cookie de sessão, /logout, e suporte a
# vários usuários (cada um com sua própria senha, ver
# volumes/proxy/manual-tls/users.example.json).
#
# Uso:
#   sh run.sh config add manual-tls
#   sh run.sh start

services:
  # Gateway e Studio deixam de ser publicados no host: só são alcançados
  # pela rede interna do compose, através do container "nginx" abaixo.
  api-gw:
    ports: !reset []

  # O Studio (esta versão) tem uma aba "Edge Functions" que só LISTA o
  # que já existe em volumes/functions (EDGE_FUNCTIONS_MANAGEMENT_FOLDER,
  # ver CONFIG.md) - a Supabase desativou de propósito criar/editar por
  # lá no self-hosted (a API self-hosted só tem rotas de leitura; ver
  # supabase/supabase#40543). Por isso o mount original vem ":ro" - o
  # Studio nunca escreve ali, então não há motivo pra liberar escrita
  # (chegamos a fazer isso, mas era a hipótese errada; revertido). Quem
  # cria/edita de verdade é o painel /admin (login-server.js), que grava
  # direto na mesma pasta.

  login:
    container_name: supabase-studio-login
    image: node:20-alpine
    restart: unless-stopped
    # `pg_dump` (backup do Postgres) e `tar` (backup das Edge Functions)
    # não vêm na imagem node:20-alpine - instala na subida do container
    # em vez de criar uma imagem própria/Dockerfile só pra isso (mantém o
    # "sem dependências, roda direto na imagem oficial" do resto do
    # projeto). Custa uns segundos a mais no start; se o servidor não
    # tiver saída pra internet nesse momento, os backups falham mas o
    # login/admin continuam funcionando normalmente.
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache postgresql-client tar >/dev/null
        exec node /app/login-server.js
    environment:
      # Reaproveita um segredo que já existe no .env (gerado pelo
      # utils/generate-keys.sh) em vez de introduzir uma variável nova só
      # para assinar o cookie de sessão.
      AUTH_COOKIE_SECRET: ${SECRET_KEY_BASE}
      PROJECT_TITLE: ${PROJECT_TITLE:-}
      PROJECT_TAGLINE: ${PROJECT_TAGLINE:-}
      PROJECT_DESCRIPTION: ${PROJECT_DESCRIPTION:-}
      FUNCTIONS_DIR: /app/functions
      PORT: "8085"
      # Só para o `pg_dump` do backup (Configurações > Backup em /admin) -
      # mesmas credenciais que os outros serviços já usam pra falar com o
      # container "db", nenhuma nova sendo introduzida.
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_CONFIG_FILE: /app/backup-config.json
      # Só leitura (mesma variável que "rest"/"studio" já recebem) - deixa
      # a aba Schemas em /admin mostrar quais schemas estão expostos hoje
      # mesmo sem o override docker-compose.schemas-panel.yml. Publicar de
      # verdade (escrever essa variável no .env e recriar os serviços)
      # continua exigindo aquele override - ver PGRST_DB_SCHEMAS acima.
      PGRST_DB_SCHEMAS: ${PGRST_DB_SCHEMAS}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8085/login"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - ./volumes/proxy/manual-tls/login-server.js:/app/login-server.js:ro
      - ./volumes/proxy/manual-tls/hash-password.js:/app/hash-password.js:ro
      # Usuários (usuário + salt + hash scrypt) - veja
      # volumes/proxy/manual-tls/users.example.json para o formato. Nunca
      # versionado (contém os hashes reais); crie a partir do .example.
      # Gravável (sem ":ro") - o CRUD em /admin escreve neste arquivo.
      - ./volumes/proxy/manual-tls/users.json:/app/users.json
      # Mesma pasta que o container "functions" (edge-runtime) serve -
      # gravável, para o editor de Edge Functions em /admin escrever
      # direto nos arquivos que o dispatcher (volumes/functions/main) já
      # lê do disco a cada requisição (sem precisar reiniciar nada).
      - ./volumes/functions:/app/functions
      # Config do backup (credenciais OAuth do Google, pasta do Drive,
      # frequência, retenção) - veja backup-config.example.json. Nunca
      # versionado (tem client secret + refresh token); crie a partir do
      # .example.
      - ./volumes/proxy/manual-tls/backup-config.json:/app/backup-config.json

  nginx:
    container_name: supabase-nginx-manual
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${SUPABASE_PROXY_PORT:-9443}:443"
    depends_on:
      api-gw:
        condition: service_healthy
      studio:
        condition: service_healthy
      login:
        condition: service_healthy
    environment:
      PROXY_DOMAIN: ${PROXY_DOMAIN}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        envsubst '$$PROXY_DOMAIN' < /etc/nginx/templates/nginx.conf.tpl > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'
    volumes:
      - ./volumes/proxy/manual-tls/nginx.conf.tpl:/etc/nginx/templates/nginx.conf.tpl:ro
      # /etc/letsencrypt do HOST (gerado pelo certbot manual, veja
      # docs/certbot-manual-dns.md), montado direto e read-only - sem
      # precisar copiar nada para dentro do repositório.
      - /etc/letsencrypt:/etc/nginx/certs:ro
