# Override opcional: monitoramento do servidor pelo navegador, atrás do
# Nginx do override manual-tls (requer ele ativo) e só para admin:
#
#   https://SEU_DOMINIO:9443/dozzle/  - Dozzle: logs ao vivo e CPU/memória/
#                                        rede/disco de cada container
#   https://SEU_DOMINIO:9443/beszel/  - Beszel: saúde do servidor (CPU,
#                                        memória, disco, rede e carga reais),
#                                        com histórico e alertas
#
# Nada é publicado no host: cada app fica numa rede só dele com o Nginx, e
# quem entra é decidido pelo login-server (rota /auth-admin) - o Nginx
# repassa o usuário num header que estes apps aceitam no lugar de login
# próprio, e sempre sobrescreve o que vier do navegador. A rede própria
# impede que OUTROS CONTAINERS falem com eles; processos na rede do próprio
# host (root/ubuntu e o beszel-agent) alcançam o IP deles, como já
# alcançam o Studio e o pg-meta.
#
# Uso: siga "Instalar (uma vez)" em docs/monitoramento.md. Além de
# "sh run.sh config add monitoring", ele gera a BESZEL_USER_PASSWORD, troca
# a senha do superusuário do Beszel por uma aleatória e, depois do "Add
# System" na tela, liga o agente (docker-compose.monitoring-agent.yml).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    networks:
      - default
      - monitoring-dozzle
      - monitoring-beszel

  # Só para o painel mostrar os atalhos "Saúde do servidor" e "Logs dos
  # containers" (e as rotas /auth-admin que o Nginx usa já existem sempre).
  login:
    environment:
      MONITORING_ENABLED: "true"

  dozzle:
    container_name: supabase-dozzle
    # Versão fixa: o Dozzle teve vários alertas de segurança em 2026, todos
    # corrigidos até a v11.3.0. Atualize de propósito (troque a tag), nunca
    # no automático.
    image: amir20/dozzle:v11.3.0
    restart: unless-stopped
    logging: *default-logging
    # Rede só dele com o Nginx: nenhum outro container fala com o Dozzle
    # direto (ele confia no header Remote-User, que pelo Nginx é sempre
    # sobrescrito).
    networks:
      - monitoring-dozzle
    volumes:
      # Necessário para ler logs/estatísticas. Atenção: ":ro" não limita a
      # API do Docker - quem controla o Dozzle controla o Docker. Por isso
      # ações e terminal ficam desligados abaixo e o acesso é só de admin.
      - ${DOCKER_SOCKET_LOCATION:-/var/run/docker.sock}:/var/run/docker.sock:ro
      # Só para mostrar load e uptime do servidor no card do host.
      - /proc:/host/proc:ro
      - dozzle-data:/data
    environment:
      DOZZLE_BASE: /dozzle
      # Confia no usuário que o Nginx repassa (Remote-User) - o Nginx fixa
      # também o Remote-Roles, sem "all". Ver nginx.conf.tpl (/dozzle/).
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_ENABLE_ACTIONS: "false"
      DOZZLE_ENABLE_SHELL: "false"
      DOZZLE_NO_ANALYTICS: "true"
      # Sem isto o Dozzle busca o avatar do usuário em gravatar.com e
      # ui-avatars.com (manda o nome do admin para fora).
      DOZZLE_DISABLE_AVATARS: "true"
    healthcheck:
      test: ["CMD", "/dozzle", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

  beszel:
    container_name: supabase-beszel
    image: henrygd/beszel:0.21.0
    restart: unless-stopped
    logging: *default-logging
    networks:
      - monitoring-beszel
    volumes:
      - beszel-data:/beszel_data
      # Socket por onde o hub fala com o agente (SSH sobre socket de
      # arquivo) - sem porta nenhuma, nem no host nem na rede.
      - beszel-socket:/beszel_socket
    environment:
      # Endereço público: o painel passa a pedir tudo em /beszel/ (o Nginx
      # tira o prefixo antes de repassar) e é o link usado nos alertas.
      APP_URL: https://${PROXY_DOMAIN}:${SUPABASE_PROXY_PORT:-9443}/beszel
      # Criados só na PRIMEIRA subida (banco vazio): o usuário que o Nginx
      # loga via TRUSTED_AUTH_HEADER e o superusuário do PocketBase, os dois
      # com esta senha. Assim nunca existe a tela de "primeiro acesso cria
      # a conta". O usuário não entra por senha (desligado abaixo); a do
      # superusuário é trocada por uma aleatória logo na instalação (ver
      # docs/monitoramento.md). Mesmo assim a linha precisa continuar no
      # .env, senão o docker compose recusa este arquivo.
      USER_EMAIL: monitor@beszel.local
      USER_PASSWORD: ${BESZEL_USER_PASSWORD:?Defina BESZEL_USER_PASSWORD no .env - veja docs/monitoramento.md}
      # O Nginx manda sempre este header com o e-mail acima, para qualquer
      # admin que passou pelo /auth-admin (ver nginx.conf.tpl, /beszel/).
      TRUSTED_AUTH_HEADER: X-Beszel-User
      DISABLE_PASSWORD_AUTH: "true"
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

volumes:
  dozzle-data:
  beszel-data:
  # Compartilhado com o beszel-agent (docker-compose.monitoring-agent.yml).
  beszel-socket:

networks:
  monitoring-dozzle:
  monitoring-beszel:
